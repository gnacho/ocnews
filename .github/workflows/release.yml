name: Release

on:
  push:
    tags:
      - 'news-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Build
        working-directory: extension
        run: npm run build

      - name: Package
        run: |
          TAG=${GITHUB_REF_NAME}
          APP=${TAG%-v*}
          VERSION=${TAG##*-v}
          mkdir -p "apps/${APP}"
          cp -r extension/dist/. "apps/${APP}/"
          cd apps
          zip -r "../${APP}-${VERSION}.zip" "${APP}/"
          cd ..
          ls -la *.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
