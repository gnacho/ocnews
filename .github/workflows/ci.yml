name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # La minor con parche (1.26.x) en vez del go.mod exacto (1.26.0):
          # con el parche fijo, govulncheck marca los CVE del stdlib que Go ya
          # corrigió en 1.26.9-1.26.11. check-latest refresca el manifiesto de
          # versiones para no quedarse en un parche anterior.
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test (race, shuffle)
        run: go test ./... -race -shuffle=on -count=1
      - name: go mod tidy check
        run: go mod tidy && git diff --exit-code

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # La minor con parche (1.26.x) en vez del go.mod exacto (1.26.0):
          # con el parche fijo, govulncheck marca los CVE del stdlib que Go ya
          # corrigió en 1.26.9-1.26.11. check-latest refresca el manifiesto de
          # versiones para no quedarse en un parche anterior.
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: golangci-lint (new issues only)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend
          only-new-issues: true

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # La minor con parche (1.26.x) en vez del go.mod exacto (1.26.0):
          # con el parche fijo, govulncheck marca los CVE del stdlib que Go ya
          # corrigió en 1.26.9-1.26.11. check-latest refresca el manifiesto de
          # versiones para no quedarse en un parche anterior.
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: gosec (SARIF, no bloquea)
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.25.0 -no-fail -fmt sarif -out results.sarif -exclude=G104 ./...
      # El upload de SARIF necesita code scanning habilitado y un token con
      # security-events: write, que los PRs de Dependabot no reciben. Cuando
      # no se puede subir, el informe se queda como artefacto del run y el
      # job sigue: lo que bloquea de verdad es govulncheck.
      - name: Upload gosec SARIF
        id: sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/results.sarif
      - name: Keep gosec SARIF as artifact
        if: steps.sarif.outcome != 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gosec-sarif
          path: backend/results.sarif
          if-no-files-found: ignore
      - name: govulncheck (bloquea)
        run: |
          # go.mod is on go 1.26, so the current govulncheck no longer needs
          # the v1.7.0 pin that #61 added for go 1.25 (x/vuln v1.8.0 requires
          # go >= 1.26.0 and the job runs with GOTOOLCHAIN=local).
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
