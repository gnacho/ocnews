name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test (race, shuffle)
        run: go test ./... -race -shuffle=on -count=1
      - name: go mod tidy check
        run: go mod tidy && git diff --exit-code

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
      - name: golangci-lint (new issues only)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v1.64.8
          working-directory: backend
          only-new-issues: true

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
      - name: gosec (SARIF, no bloquea)
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -no-fail -fmt sarif -out results.sarif -exclude=G104 ./...
      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/results.sarif
      - name: govulncheck (bloquea)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
