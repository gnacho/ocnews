version: 2
project_name: ocnews

before:
  hooks:
    - sh -c 'cd backend && go mod tidy'

builds:
  - id: ocnews
    dir: backend
    main: ./cmd/ocnews
    binary: ocnews
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: ocnews
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  draft: true
